# dsh-enter-remap 配置文件
#
# 三个快捷键各自的动作，可选值：
#   newline   换行（原生 Shift+Enter）
#   send      发送（原生 Enter：忙时按「设置 → 通用 → 繁忙时的发送行为」里的第一选择）
#   busySend  发送（原生 Ctrl+Enter：忙时按同一设置里的第二选择）
#
# 三个键位必须各用一个不同动作；在界面里互换时插件会自动对调两格。
# 这里手改单个值后，请确认三行仍然互不相同。
#
# 修改后重启 DSH 生效。

- insert:
    - id: dsh-enter-remap
      name: dsh-enter-remap
      config:
        enter: newline
        ctrlEnter: send
        shiftEnter: busySend
